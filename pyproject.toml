[project]
name = "mojo-stumpy"
version = "0.1.0"
description = "Mojo matrix-profile kernels with a STUMPY-compatible Python API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "matrix-profile", "time-series", "stumpy"]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "stumpy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
